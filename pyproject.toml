[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "su-detect"
version = "2.0.0"
description = "Scope-bound exposure measurements, inventory, and evidence tracking"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
su-detect = "sudetect.__main__:main"

[tool.setuptools.packages.find]
include = ["sudetect*"]
