name: offline-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/idgen.py --selftest
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python tools/test_wheel.py
      - if: runner.os == 'Linux'
        run: bash tools/test_probe.sh
  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[browser,test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser.py -v
      - run: python -m unittest discover -s tests -p test_integration.py -v
