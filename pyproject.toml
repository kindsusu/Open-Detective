[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-detective"
version = "2.0.0"
description = "Scope-bound exposure measurements, inventory, and evidence tracking"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
documents = ["pypdf>=5,<7"]
media = [
  "rapidocr-onnxruntime==1.4.4",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
open-detective = "sudetect.__main__:main"
su-detect = "sudetect.__main__:main"

[project.urls]
Homepage = "https://github.com/kindsusu/Open-Detective"
Repository = "https://github.com/kindsusu/Open-Detective"

[tool.setuptools.packages.find]
include = ["sudetect*"]
