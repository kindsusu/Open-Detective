[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-detective"
version = "2.0.0"
description = "Scope-bound exposure measurements, inventory, and evidence tracking"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
open-detective = "sudetect.__main__:main"
su-detect = "sudetect.__main__:main"

[project.urls]
Homepage = "https://github.com/kindsusu/Open-Detective"
Repository = "https://github.com/kindsusu/Open-Detective"

[tool.setuptools.packages.find]
include = ["sudetect*"]
