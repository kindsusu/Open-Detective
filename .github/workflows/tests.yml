name: offline-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,documents]"
      - run: open-detective --version
      - run: su-detect --version
      - run: python -m unittest discover -s tests -v
      - run: python tools/idgen.py --selftest
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python tools/test_wheel.py
      - if: runner.os == 'Linux'
        run: bash tools/test_probe.sh
  browser-fixtures:
    # Ubuntu 24.04 restricts unprivileged user namespaces for downloaded
    # Chromium builds; retain Chromium's sandbox on the browser test runner.
    # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[browser,test,documents]"
      - run: python -m playwright install --with-deps chromium
      - name: Verify sandboxed Chromium startup
        run: |
          python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          try:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True, chromium_sandbox=True)
                  try:
                      page = browser.new_page()
                      page.set_content("<!doctype html><title>Sandbox smoke</title>")
                      if page.title() != "Sandbox smoke":
                          raise RuntimeError("empty_page_check_failed")
                  finally:
                      browser.close()
          except Exception as exc:
              print("SANDBOX_PREFLIGHT_FAILED:", type(exc).__name__, file=sys.stderr)
              for line in str(exc).splitlines():
                  if any(word in line.lower() for word in (
                      "sandbox", "apparmor", "namespace", "permission denied",
                      "operation not permitted", "failed to move")):
                      print(line[:500], file=sys.stderr)
              raise SystemExit(1)
          print("SANDBOX_PREFLIGHT_OK")
          PY
      - run: python -m unittest discover -s tests -p test_browser.py -v
      - run: python -m unittest discover -s tests -p test_integration.py -v
      - run: python -m unittest discover -s tests -p test_dom_replay.py -v
      - run: python -m unittest discover -s tests -p test_gate_review.py -v
      - run: python -m unittest discover -s tests -p test_runtime_review.py -v
      - run: python -m unittest discover -s tests -p test_audit.py -v
